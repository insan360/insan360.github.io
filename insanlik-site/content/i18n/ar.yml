  about:
    eyebrow: من نحن
    title: منظمة خيرية إنسانية تدعم المجتمعات الهشة
    text: مؤسسة إنسانلك للمساعدة والتضامن (İnsanlık Eli Yardımlaşma ve Dayanışma Derneği) هي منظمة إنسانية غير ربحية مسجلة رسميًا في الجمهورية التركية تحت الرقم ⁦34-296-189⁩، وتعمل على تقديم المساعدات الإنسانية والتنموية للفئات الأكثر ضعفًا والمتضررة من الأزمات والنزاعات والكوارث، من خلال برامج متكاملة تستند إلى مبادئ الإنسانية والعدالة والشفافية والمهنية. وتمتد أنشطة المؤسسة داخل تركيا وفي عدد من الدول، بالتعاون مع شركاء محليين ودوليين، لضمان وصول المساعدات إلى مستحقيها بكفاءة وفعالية.
    more: اقرأ المزيد عن يد الإنسانية للإغاثة
  vision_mission:
  - title: رؤيتنا
    text: عالم يتمتع فيه كل إنسان بالكرامة، وتتوافر له الفرص الأساسية لحياة آمنة وكريمة.
  - title: رسالتنا
    text: نسعى إلى صون الكرامة الإنسانية وتوفير الاحتياجات الأساسية من خلال برامج الإغاثة والتنمية، القائمة على العدالة والشفافية والمهنية، بما يسهم في تحسين حياة المجتمعات الأكثر ضعفًا وتعزيز قدرتها على الصمود.
  programs:
    eyebrow: برامجنا الرئيسية
    title: محاور عملنا الإنساني
    text: نعمل من خلال خمسة محاور استراتيجية تغطي الاحتياجات الأساسية للمجتمعات المتضررة.
  media:
