about:
  badge: تأسست في فبراير 2026
  title: نصنع الأثر ونحفظ الأمانة
  title_highlight: ونحفظ الأمانة
  intro: جمعية İnsanlık Eli Yardımlaşma ve Dayanışma Derneği منظمة خيرية إنسانية مسجلة في الجمهورية التركية تحت رقم ⁦34-296-189⁩ بصفتها مؤسسة غير ربحية تعنى بالعمل الإنساني والإغاثي ذات بعد دولي لدعم المجتمعات والفئات الهشة.
  vision_mission:
  - title: رؤيتنا
    text: عالم يتمتع فيه كل إنسان بالكرامة والفرص الأساسية لحياة آمنة وكريمة.
  - title: رسالتنا
    text: نعمل على صون كرامة الإنسان وتوفير احتياجاته الأساسية عبر برامج إغاثية وتنموية تقوم على العدالة، والشفافية، والمهنية.
  values:
    eyebrow: مبادئنا الأساسية
    title: القيم التي تحركنا ميدانياً
    items:
    - title: الكرامة الإنسانية
      text: نضع كرامة الإنسان في قلب كل تدخل ونحرص على ألا تتحول المساعدة إلى أداة إذلال أو استغلال.
    - title: العدالة وعدم التمييز
      text: نوفر خدماتنا للجميع دون أي تمييز بسبب الدين، أو العرق، أو الجنس، أو الجنسية، أو الانتماء.
    - title: الشفافية المطلقة
      text: ندير مواردنا المالية والإدارية بوضوح، ونشارك معلوماتنا وتقاريرنا مع الداعمين والشركاء وفق أفضل الممارسات.
    - title: الأثر المستدام
      text: نركز على تصميم وتنفيذ برامج ذات أثر حقيقي قابل للقياس، بدل الاكتفاء بالحضور الشكلي أو الأرقام الدعائية.
  goals:
    eyebrow: أهدافنا الاستراتيجية
    title: ستة أهداف نصيغ بها المستقبل
    items:
    - 'تعزيز الاستجابة الإغاثية السريعة والفعالة: الارتقاء بقدرات المؤسسة في التدخل العاجل خلال الأزمات والكوارث عبر منظومة جاهزة للاستجابة توفر الغذاء والمأوى والرعاية الصحية للفئات المتضررة من الحروب والأزمات.'
    - 'تحسين جودة الحياة للفئات الهشة والمتضررين من الحروب والكوارث الطبيعية: تنفيذ برامج مستدامة تعالج الاحتياجات الأساسية وتوفر فرص التعليم، والصحة، والدعم النفسي الاجتماعي بما يسهم في استعادة الحياة الكريمة للمتضررين.'
    - 'تمكين الأسر المتضررة وتعزيز قدرتها على الصمود: بناء برامج تنموية وسبل عيش تمكن الأسر من الاعتماد على ذاتها وتساعدهم على تجاوز آثار الحرب والتهجير والفقر.'
    - توفير الحد الأدنى من خدمات الصحة والتعليم للفئات المستهدفة.
    - 'بناء شراكات استراتيجية محلية ودولية: توسيع شبكة الشراكات مع المؤسسات الإنسانية والجهات المانحة لتعزيز الوصول إلى المستفيدين وزيادة حجم التأثير الإنساني.'
    - 'تطوير الأداء المؤسسي وضمان الشفافية والمساءلة: تعزيز الحوكمة الإدارية والمالية، وبناء أنظمة فعالة للمتابعة والتقييم لضمان الاستخدام الأمثل للموارد ورفع مستوى الثقة لدى الشركاء والمانحين.'
