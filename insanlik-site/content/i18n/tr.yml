home:
  hero_highlight: İnsanlık Eli
  hero_title: Etki Yaratmak. Güveni Korumak
  hero_sub: İnsanlık Eli Yardım ve Dayanışma Derneği (İnsanlık Eli), uluslararası insani yardım çalışmalarına adanmış, kâr amacı gütmeyen bir Türk yardım kuruluşudur. Savaşlar, yoksulluk, afetler, salgın hastalıklar ve yerinden edilmelerden etkilenen hassas toplulukları destekler. Yerel saha ekipleri ve güvenilir ortakları aracılığıyla dernek; temel yardımları yüksek profesyonellik, şeffaflık ve insan onuruna saygı ilkesiyle ulaştırır.
  hero_cta: Projelerimizi Keşfedin
  trust:
  - Türkiye'de Resmi Lisanslı
  - '%100 Mali Şeffaflık'
  - 12 Aktif Ülke
  counters:
  - value: 48000
    suffix: +
    label: Faydalanıcı Birey Sayısı
    sub: Doğrudan ve belgelenmiş etki
  - value: 320
    suffix: +
    label: Tamamlanan Projeler
    sub: Kuruluştan bu yana
  - value: 12
    suffix: ''
    label: Aktif Coğrafi Bölgeler
