  - value: 45
    suffix: +
    label: Ortak Sayısı
    sub: Yerel ve uluslararası ortaklar
  about:
    eyebrow: Hakkımızda
    title: 'İnsanlık Eli: Etki Yaratır, Güveni Korur.'
    text: 'İnsanlık Eli Yardımlaşma ve Dayanışma Derneği, Türkiye''de kayıtlı (Kütük No: 34-296-189), kâr amacı gütmeyen bir insani yardım kuruluşudur. Kendisini uluslararası insani yardım çalışmalarına adamış olup; savaşlar, yoksulluk, doğal afetler, salgın hastalıklar ve yerinden edilmelerle karşı karşıya kalan toplulukları ve hassas grupları desteklemektedir. Dernek; yardımları profesyonellik, şeffaflık ve insan onuruna saygı ilkeleri doğrultusunda ulaştırmak amacıyla saha ekipleri ve güvenilir ortakları aracılığıyla faaliyet göstermektedir.'
    more: İnsanlık Eli Derneği hakkında daha fazlasını okuyun
  vision_mission:
  - title: Vizyonumuz
    text: Her insanın güvenli ve onurlu bir yaşam için temel haklara ve fırsatlara sahip olduğu bir dünya.
  - title: Misyonumuz
    text: Adalet, şeffaflık ve profesyonellik üzerine kurulu insani yardım ve kalkınma programları aracılığıyla insanlık onurunu korumak ve temel ihtiyaçları karşılamak için çalışıyoruz.
  programs:
    eyebrow: Ana Programlarımız
    title: İnsani Çalışma Alanlarımız
    text: Etkilenen toplulukların temel ihtiyaçlarını karşılayan beş stratejik alanda çalışıyoruz.
  news:
    eyebrow: Haberlerimiz
    title: Sahadaki Son Gelişmeler ve Diplomatik Faaliyetler
    text: Önemli ziyaretler, anlaşmalar ve tamamlanan projelerle ilgili sürekli takibimizi izleyin
about:
  badge: Şubat 2026'da kuruldu
  title: Etkili Çözümler Sunar. Güveni Korur
  title_highlight: Güveni Korur
  intro: İnsanlık Eli Yardımlaşma ve Dayanışma Derneği, Türkiye Cumhuriyeti'nde 34-296-189 numarasıyla kayıtlı, uluslararası düzeyde insani yardım ve kalkınma çalışmaları yürüten, kâr amacı gütmeyen bir sivil toplum kuruluşudur.
  vision_mission:
  - title: Vizyonumuz
    text: Açlık, hastalık ve adaletsizlikten uzak, adalet ve eşitliğin hakim olduğu, her insanın onur ve güvenli bir yaşam için temel fırsatlara sahip olduğu bir dünya.
  - title: Misyonumuz
    text: Adalet ve tam şeffaflık üzerine kurulu sürdürülebilir yardım ve kalkınma programları aracılığıyla insan onurunu korumak ve savunmasız toplulukları güçlendirmek.
  values:
    eyebrow: Temel İlkelerimiz
    title: Sahada Bizi Yönlendiren Değerler
    items:
    - title: İnsan Onuru
      text: Faaliyetlerimizin merkezinde insan onuru yer alır. Her bireye saygıyla yaklaşır, yardımın hiçbir koşulda aşağılanma veya istismar aracına dönüşmemesine özen gösteririz.
    - title: Adalet ve Ayrımcılık Yapmama
      text: Din, ırk, milliyet, cinsiyet veya sosyal statü ayrımı gözetmeksizin ihtiyaç sahibi herkese eşit ve adil şekilde ulaşmayı ilke ediniriz.
    - title: Şeffaflık
      text: Mali ve idari kaynaklarımızı şeffaf biçimde yönetir; faaliyetlerimiz ve sonuçlarımız hakkında destekçilerimiz ve paydaşlarımızı düzenli olarak bilgilendiririz.
    - title: Kalite ve Etki
      text: Gerçek ihtiyaçlara dayanan, ölçülebilir ve sürdürülebilir sonuçlar üreten programlar tasarlar ve uygularız. Faaliyetlerimizin başarısını yalnızca ulaşılan rakamlarla değil, bireylerin ve toplumların yaşamlarında oluşturduğu kalıcı etkiyle değerlendiririz.
  goals:
    eyebrow: Stratejik Hedefler
    title: Geleceği Şekillendiren Altı Hedef
    items:
    - 'Hızlı ve Etkin İnsani Müdahale: Savaş, afet ve krizlerden etkilenen bölgelerde gıda, barınma ve sağlık hizmeti sunarak, acil durumlarda hızlı ve etkili müdahale kapasitesini artırmak.'
    - 'Kırılgan Grupların Yaşam Kalitesini İyileştirmek: Eğitim, sağlık ve psikososyal programlar aracılığıyla bireylerin ve ailelerin yaşam koşullarının iyileştirilmesine katkı sağlamak.'
    - 'Aileleri Güçlendirmek ve Dayanıklılıklarını Artırmak: Geçim kaynakları ve kalkınma programlarıyla ailelerin kendi kendine yeterliliklerini desteklemek ve krizlerin olumsuz etkilerini azaltmak.'
    - 'İş Birliği ve Etki Alanını Genişletmek: Ulusal ve uluslararası paydaşlarla güçlü ortaklıklar kurarak daha fazla ihtiyaç sahibine ulaşmak ve insani yardım çalışmalarının etkisini artırmak.'
    - 'Kurumsal Kapasiteyi Güçlendirmek: Etkin yönetişim, izleme ve değerlendirme sistemleri aracılığıyla kurumsal kapasiteyi geliştirmek, kaynakların verimli kullanımını sağlamak ve paydaş güvenini güçlendirmek.'
    - Kurumsal performansı geliştirmek ve en yüksek yönetişim ve şeffaflık standartlarını sağlamak.
