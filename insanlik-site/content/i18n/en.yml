about:
  badge: Founded in February 2026
  title: Delivering Impact. Upholding Trust
  title_highlight: Upholding Trust
  intro: Humanity Hand Aid & Solidarity Association or İnsanlık Eli Yardımlaşma ve Dayanışma Derneği is a humanitarian charitable organization registered in the Republic of Türkiye under registration number 34-296-189, as a non-profit institution dedicated to humanitarian and relief work with an international scope, supporting communities and vulnerable groups.
  vision_mission:
  - title: Our Vision
    text: A world in which every person enjoys dignity and access to the essential opportunities for a safe and dignified life.
  - title: Our Mission
    text: We work to safeguard human dignity and provide essential needs through relief and development programs based on justice, transparency, and professionalism.
  values:
    eyebrow: Our Core Principles
    title: The Values That Drive Us in the Field
    items:
    - title: Human Dignity
      text: We place human dignity at the heart of every intervention and ensure that assistance never becomes a tool of humiliation or exploitation.
    - title: Justice & Non-Discrimination
      text: We provide our services to all without any discrimination based on religion, race, gender, nationality, or affiliation.
    - title: Transparency
      text: We manage our financial and administrative resources with clarity and share our information and reports with donors and partners in accordance with best practices.
    - title: Quality & Impact
      text: We prioritize the design and implementation of programs that deliver real, measurable impact, rather than merely maintaining a symbolic presence or relying on promotional figures.
  goals:
    eyebrow: Strategic Goals
    title: Six Goals Shaping the Future
    items:
    - 'Strengthening Rapid and Effective Humanitarian Response: Enhancing the organization''s capacity for urgent intervention during crises and disasters through a ready-response system that provides food, shelter, and healthcare to those affected by wars and emergencies.'
    - 'Improving the Quality of Life for Vulnerable Groups and Those Affected by Wars and Natural Disasters: Implementing sustainable programs that address basic needs and provide access to education, healthcare, and psychosocial support, contributing to the restoration of a dignified life for affected populations.'
    - 'Empowering Affected Families and Strengthening Their Resilience: Developing livelihood and development programs that enable families to become self-reliant and help them overcome the impacts of war, displacement, and poverty.'
    - Providing Minimum Essential Health and Education Services to Targeted Groups.
    - 'Building Strategic Local and International Partnerships: Expanding partnerships with humanitarian organizations and donor entities to enhance access to beneficiaries and increase overall humanitarian impact.'
    - 'Developing Institutional Performance and Ensuring Transparency and Accountability: Strengthening administrative and financial governance and establishing effective monitoring and evaluation systems to ensure optimal use of resources and enhance trust among partners and donors.'
